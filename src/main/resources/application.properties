spring.application.name=CafeBackend
#Conexión a Base de Datos (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:cavoshDB}
spring.datasource.username=${DB_USER:cavosh}
spring.datasource.password=${DB_PASSWORD:cavosh123}
spring.datasource.driver-class-name=org.postgresql.Driver

#Configuración JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Configuración JWT (Seguridad)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:24}


# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.docker.compose.mode=off
spring.config.import=optional:file:.env[.properties]