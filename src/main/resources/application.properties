spring.application.name=CafeBackend

# ==========================================
# 1. Conexión a Base de Datos (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cavoshDB}
spring.datasource.username=${DB_USER:cavosh}
spring.datasource.password=${DB_PASSWORD:cavosh123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. Configuración JPA e Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 3. Configuración JWT (Seguridad)
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_HOURS:24}

# ==========================================
# 4. Documentación OpenAPI / Swagger
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html