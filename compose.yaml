services:
  postgres:
    image: postgres:16-alpine
    container_name: cavosh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cavoshDB
      POSTGRES_USER: cavosh
      POSTGRES_PASSWORD: cavosh123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/basedatos.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-db/datos.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cavosh -d cavoshDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cavosh-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Conexión a la base de datos dentro de la red interna de Docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cavosh_db?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: cavosh_user
      SPRING_DATASOURCE_PASSWORD: cavosh_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      # Claves de cifrado y JWT (ajusta con tus valores)
      JWT_SECRET: ${JWT_SECRET:claveSecretaSuperLargaYSeguraParaTokensJwtDeCavoshCafe2026}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY:claveSecretaAES256De32BytesLongitud!}

      # Configuración SMTP (para tokens de recuperación)
      MAIL_USERNAME: ${MAIL_USERNAME:tu_correo@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:tu_password_de_aplicacion}
volumes:
  pgdata:
    driver: local
